name: aos

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read
  actions: read

jobs:
  agent:
    if: >-
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@zoorikapp') &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.issue.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@zoorikapp') &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association) &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association) &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@zoorikapp') &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.review.author_association) &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.pull_request.author_association) &&
        github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@zoorikapp') || contains(github.event.issue.title, '@zoorikapp')) &&
        contains(fromJSON('["OWNER","MEMBER"]'), github.event.issue.author_association))
    uses: getzoorik/.github/.github/workflows/aos.yaml@cf48b5cb880794b584639c037ae120c27c00d4dc
    with:
      agent: be/coral/zoorikctl
    secrets:
      AOS_APP_CLIENT_ID: ${{ secrets.AOS_APP_CLIENT_ID }}
      AOS_APP_PRIVATE_KEY: ${{ secrets.AOS_APP_PRIVATE_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ZOORIK_AOS }}
