apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: zoorik
spec:
  version: {{ .TagName }}
  homepage: https://github.com/getzoorik/zoorikctl
  shortDescription: Connect a cluster to Zoorik Coral
  description: |
    Zoorik Coral reduces the cost of AKS and EKS clusters. It sizes pod CPU
    and memory requests from their real use and rebalances workloads onto
    fewer, cheaper nodes, autonomously and without downtime. This plugin
    prepares a cluster for Coral and connects it with a one-time token from
    the Coral console, so it needs a Zoorik account. Every change is printed
    before it is made, and disconnect removes what Zoorik added.
  platforms:
  - selector:
      matchLabels:
        os: darwin
        arch: arm64
    {{addURIAndSha "https://github.com/getzoorik/zoorikctl/releases/download/{{ .TagName }}/zoorikctl_{{ .TagName }}_darwin_arm64.tar.gz" .TagName }}
    bin: zoorikctl
  - selector:
      matchLabels:
        os: darwin
        arch: amd64
    {{addURIAndSha "https://github.com/getzoorik/zoorikctl/releases/download/{{ .TagName }}/zoorikctl_{{ .TagName }}_darwin_amd64.tar.gz" .TagName }}
    bin: zoorikctl
  - selector:
      matchLabels:
        os: linux
        arch: amd64
    {{addURIAndSha "https://github.com/getzoorik/zoorikctl/releases/download/{{ .TagName }}/zoorikctl_{{ .TagName }}_linux_amd64.tar.gz" .TagName }}
    bin: zoorikctl
  - selector:
      matchLabels:
        os: linux
        arch: arm64
    {{addURIAndSha "https://github.com/getzoorik/zoorikctl/releases/download/{{ .TagName }}/zoorikctl_{{ .TagName }}_linux_arm64.tar.gz" .TagName }}
    bin: zoorikctl
  - selector:
      matchLabels:
        os: windows
        arch: amd64
    {{addURIAndSha "https://github.com/getzoorik/zoorikctl/releases/download/{{ .TagName }}/zoorikctl_{{ .TagName }}_windows_amd64.zip" .TagName }}
    bin: zoorikctl.exe
  - selector:
      matchLabels:
        os: windows
        arch: arm64
    {{addURIAndSha "https://github.com/getzoorik/zoorikctl/releases/download/{{ .TagName }}/zoorikctl_{{ .TagName }}_windows_arm64.zip" .TagName }}
    bin: zoorikctl.exe
